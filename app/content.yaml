about:
  lead: "I think like an attacker — so organizations, and everyday people, don't have to learn the hard way."
  paragraphs:
    - "For 10+ years I've worked on both sides of security: penetration testing, digital forensics, SOC operations, and today Cyber Threat Intelligence in Indonesia's banking sector — hunting phishing sites, fraud networks, malicious apps and data leaks before they reach people."
    - "The other half of my work is AI. I build Agentic AI and LLM-powered systems that automate threat intelligence, brand protection and incident response — turning hours of manual analysis into minutes."
    - "Outside my day job I break cybersecurity and AI down for everyone: how hackers and scammers really think, and how AI can genuinely help you."

