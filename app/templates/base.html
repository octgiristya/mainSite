<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ c.site.title }}{% endblock %}</title>
  <meta name="description" content="{{ c.site.description }}">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{ c.site.url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ c.site.title }}">
  <meta property="og:description" content="{{ c.site.description }}">
  <meta property="og:url" content="{{ c.site.url }}">
  <meta property="og:image" content="{{ c.site.url.rstrip('/') }}{{ c.site.og_image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@{{ c.profile.handle }}">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/img/ogi.jpg">
  <link rel="preload" href="/static/fonts/chakra-petch-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/img/hero.webp" as="image" type="image/webp" media="(min-width: 700px)">
  <link rel="preload" href="/static/img/hero-sm.webp" as="image" type="image/webp" media="(max-width: 699px)">
  <link rel="stylesheet" href="/static/css/style.css?v={{ v }}">
  <script nonce="{{ nonce }}" type="application/ld+json">
  {{ {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": c.profile.name,
    "alternateName": c.profile.nickname,
    "jobTitle": c.profile.role,
    "url": c.site.url,
    "image": c.site.url.rstrip('/') ~ c.profile.photo_fallback,
    "sameAs": c.links | rejectattr("primary") | map(attribute="url") | list
  } | tojson }}
  </script>
  <script src="/static/js/main.js?v={{ v }}" defer></script>
  <script src="/static/js/fx.js?v={{ v }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="fx-noise" aria-hidden="true"></div>
  <div class="fx-scan" aria-hidden="true"></div>
  {% block body %}{% endblock %}
</body>
</html>
